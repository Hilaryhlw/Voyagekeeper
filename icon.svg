<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8d0d4"/>
      <stop offset="55%" stop-color="#c4a8b4"/>
      <stop offset="100%" stop-color="#9a8098"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a89aaa"/>
      <stop offset="100%" stop-color="#7a6880"/>
    </linearGradient>
    <clipPath id="round">
      <rect width="512" height="512" rx="112" ry="112"/>
    </clipPath>
  </defs>

  <!-- Background sky -->
  <rect width="512" height="512" fill="url(#bg)" rx="112" ry="112"/>

  <!-- Sun -->
  <circle cx="256" cy="195" r="46" fill="#e8a882" opacity="0.9"/>
  <circle cx="256" cy="198" r="46" fill="#d4906a" opacity="0.25"/>

  <!-- Distant hills / islands -->
  <ellipse cx="100" cy="310" rx="140" ry="30" fill="#7a6875" opacity="0.65"/>
  <ellipse cx="420" cy="318" rx="120" ry="26" fill="#7a6875" opacity="0.55"/>
  <ellipse cx="256" cy="322" rx="180" ry="28" fill="#6e6070" opacity="0.75"/>

  <!-- Sea layers -->
  <path d="M0 336 Q64 328 128 336 Q192 344 256 336 Q320 328 384 336 Q448 344 512 336 L512 512 L0 512Z" fill="url(#sea)" opacity="0.85"/>
  <path d="M0 358 Q64 352 128 358 Q192 364 256 358 Q320 352 384 358 Q448 364 512 358 L512 512 L0 512Z" fill="#8a7888" opacity="0.7"/>
  <path d="M0 380 Q64 375 128 380 Q192 385 256 380 Q320 375 384 380 Q448 385 512 380 L512 512 L0 512Z" fill="#7a6878" opacity="0.8"/>

  <!-- Wave ripples -->
  <path d="M60 350 Q90 346 120 350" stroke="rgba(255,255,255,0.25)" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M200 344 Q230 340 260 344" stroke="rgba(255,255,255,0.2)" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M380 352 Q410 348 440 352" stroke="rgba(255,255,255,0.2)" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- Sailboat hull -->
  <path d="M218 330 Q256 342 294 330 L286 350 Q256 358 226 350Z" fill="#3a2e30"/>

  <!-- Mast -->
  <line x1="256" y1="250" x2="256" y2="332" stroke="#3a2e30" stroke-width="4" stroke-linecap="round"/>

  <!-- Main sail -->
  <path d="M256 256 L256 328 L300 312 Z" fill="#8b3a52" opacity="0.88"/>

  <!-- Foresail -->
  <path d="M256 275 L256 328 L218 320 Z" fill="#f0e4e7" opacity="0.75"/>

  <!-- Boom -->
  <line x1="256" y1="328" x2="298" y2="335" stroke="#3a2e30" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Sun reflection on water -->
  <ellipse cx="256" cy="368" rx="30" ry="6" fill="#e8b090" opacity="0.18"/>
</svg>
